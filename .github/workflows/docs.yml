# Publica la documentación (docs-site/) en GitHub Pages:
#   https://la-borbolla-editorial.github.io/organon/
#
# Se lanza sola cuando un cambio en docs-site/ llega a main, o a mano desde
# Actions → Docs → Run workflow. En los PR solo compila, para detectar errores.
#
# Requiere, una sola vez: Settings → Pages → Source: «GitHub Actions».
name: Docs

on:
  push:
    branches: [main]
    paths: ['docs-site/**', '.github/workflows/docs.yml']
  pull_request:
    paths: ['docs-site/**', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # para la fecha de «Última actualización» de cada página
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: docs-site/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
