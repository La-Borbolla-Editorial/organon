[package]
name = "organon"
version = "0.4.0"
edition = "2021"
description = "Lector de PDF y fichero para escribir una tesis"
license = "MIT"
authors = ["José Pablo Iglesias"]

[lib]
name = "organon_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
